name: Deploy Faceless Phase 3 Reels to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: faceless-phase-3-reels-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: nhyqr-api-0830lb01
  API_URL: https://nhyqr-api-0830lb01.azurewebsites.net
  WEB_URL: https://icy-field-0855c4810.3.azurestaticapps.net

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            webapp/package-lock.json

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx tsx --test tests/demoLogin.test.ts
          npm run build

      - name: Build frontend
        working-directory: webapp
        env:
          VITE_API_URL: ${{ env.API_URL }}/api
          VITE_APP_NAME: NHY-QR Ad Manager
        run: |
          npm ci
          npm run build

      - name: Prepare backend production package
        working-directory: backend
        run: |
          npm prune --omit=dev
          npx prisma generate

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-production
          path: backend
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: webapp/dist
          if-no-files-found: error

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-production
          path: backend

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_NHYQR }}
          package: backend

      - name: Verify backend and demo authentication
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${API_URL}/api/health" > /dev/null
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -d '{"phone":"9876543210"}' \
              "${API_URL}/api/auth/send-otp" > /dev/null \
              && curl --fail --silent --show-error \
                -H 'Content-Type: application/json' \
                -d '{"phone":"9876543210","code":"000000","name":"Demo User"}' \
                "${API_URL}/api/auth/verify-otp" > /dev/null; then
              exit 0
            fi
            echo "Authentication is not ready yet (attempt ${attempt}/12)."
            sleep 10
          done
          exit 1

  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-production
          path: webapp-dist

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NHYQR }}
          action: upload
          app_location: webapp-dist
          output_location: ""
          skip_app_build: true

      - name: Verify frontend
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${WEB_URL}" > /dev/null
