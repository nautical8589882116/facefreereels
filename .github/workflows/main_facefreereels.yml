# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# This repo is a monorepo:
#   backend/  – Express + Prisma API (TypeScript -> dist/)
#   webapp/   – React + Vite SPA     (-> dist/, copied into backend/public)
#
# A single App Service hosts both: Express serves /api/* and falls back to the
# SPA's index.html for every other path.

name: Build and deploy Node.js app to Azure Web App - facefreereels

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: facefreereels
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Frontend ────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: webapp
        run: npm ci

      - name: Build frontend
        working-directory: webapp
        run: npm run build

      # ── Backend ─────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ── Assemble deployment package ─────────────────────────
      - name: Copy built SPA into backend/public
        run: |
          rm -rf backend/public
          cp -r webapp/dist backend/public

      - name: Prune backend to production dependencies
        working-directory: backend
        run: |
          npm prune --omit=dev
          npx prisma generate

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Only the backend folder is deployed — it now contains dist/,
          # public/ (the SPA), prisma/, node_modules/ and package.json.
          path: backend
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # NOTE: do not add a GitHub `environment:` here. It changes the OIDC subject
    # claim to `repo:<owner>/<repo>:environment:<name>`, while Azure's federated
    # credential is registered for the branch subject
    # (`repo:<owner>/<repo>:ref:refs/heads/main`) — the mismatch fails login with
    # AADSTS700213.
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F40C66F76BDE44F7B10FC894C2B09FEF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_905EFC271A6B4DDD8115B0990A8B71D4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42F3C0A12EF9463CA7CC875494FC628C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: .
          startup-command: 'npm run start:azure'
