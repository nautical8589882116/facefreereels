[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facefreereels"
version = "0.1.0"
description = "Generate face-free vertical reels with TTS voiceover and captions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "edge-tts>=6.1.12",
  "ffmpeg-python>=0.2.0",
  "Pillow>=10.4.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
facefreereels = "facefreereels.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
